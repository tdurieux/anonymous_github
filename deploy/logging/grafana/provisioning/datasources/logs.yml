apiVersion: 1
datasources:
  - name: Logs
    uid: anonymous-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    jsonData:
      logLevelRules:
        - {field: severity, operator: equals, value: debug, level: debug, enabled: true}
        - {field: severity, operator: equals, value: info, level: info, enabled: true}
        - {field: severity, operator: equals, value: warn, level: warn, enabled: true}
        - {field: severity, operator: equals, value: error, level: error, enabled: true}
        - {field: severity, operator: equals, value: fatal, level: fatal, enabled: true}
    isDefault: true
    editable: false
  - name: Logging health
    uid: logging-health
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
  - name: Alert state
    uid: logging-alerts
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData: {implementation: prometheus}
    editable: false
