<div class="pr-page">
  <div class="container paper-page pr-page-inner">
    <div class="paper-crumbs">
      <a href="/dashboard">Reviewer</a> &nbsp;/&nbsp;
      <span class="here">Pull request</span>
    </div>

    <header class="pr-header">
      <h1 class="paper-page-title pr-title">
        <span v-if="details?.title" v-text="details?.title"></span>
        <span class="text-muted" v-if="!details?.title">Untitled pull request</span>
        <a class="btn btn-sm" aria-label="Edit" v-if="options?.isAdmin || options?.isOwner" :href="safeUrl(&quot;/pull-request-anonymize/&quot; + (pullRequestId))"><i class="far fa-edit"></i><span class="d-none d-md-inline"> Edit</span></a>
      </h1>
      <div class="pr-header-meta">
        <span class="paper-pill" :class="{&#x27;good&#x27;: details?.merged, &#x27;warn&#x27;: details?.state == &#x27;open&#x27;, &#x27;bad&#x27;: details?.state == &#x27;closed&#x27; &amp;&amp; !details?.merged}">
          <span class="status-dot" :class="{&#x27;status-ready&#x27;: details?.merged, &#x27;status-error&#x27;: details?.state == &#x27;closed&#x27; &amp;&amp; !details?.merged}"></span>
          {{ details?.merged ? 'Merged' : fmt.title(details?.state) }}
        </span>
        <span class="pr-meta-item" v-if="details?.baseRepositoryFullName">
          <i class="fab fa-github"></i> <span v-text="details?.baseRepositoryFullName"></span>
        </span>
        <span class="pr-meta-item" v-if="details?.updatedDate">
          <i class="far fa-clock"></i> <span v-text="fmt?.date(details?.updatedDate)"></span>
        </span>
        <span class="pr-meta-item" v-if="details?.anonymizeDate">
          <i class="fas fa-user-secret"></i> Anonymized <span v-text="fmt?.date(details?.anonymizeDate)"></span>
        </span>
      </div>
    </header>

    <section class="pr-body-card" v-if="details?.body">
      <div class="paper-section-eyebrow">Description</div>
      <markdown :content="details?.body"></markdown>
    </section>

    <nav class="paper-tabs" role="tablist" v-if="details?.diff || details?.comments">
      <button class="paper-tab" type="button" role="tab" v-if="details?.diff" :class="{&#x27;active&#x27;: tabState?.active == &#x27;diff&#x27;}" @click="tabState.active = &#x27;diff&#x27;">
        <i class="fas fa-code"></i> Diff
      </button>
      <button class="paper-tab" type="button" role="tab" v-if="details?.comments" :class="{&#x27;active&#x27;: tabState?.active == &#x27;comments&#x27;}" @click="tabState.active = &#x27;comments&#x27;">
        <i class="far fa-comment-dots"></i>
        <span v-text="fmt.plural(details?.comments?.length, {&#x27;0&#x27;: &#x27;No comments&#x27;, &#x27;one&#x27;: &#x27;1 comment&#x27;, &#x27;other&#x27;: &#x27;{} comments&#x27;})"></span>
      </button>
    </nav>

    <div class="paper-tab-content">
      <div v-if="details?.diff &amp;&amp; tabState?.active ==&#x27;diff&#x27;">
        <div class="pr-diff" v-html="sanitize(fmt?.diff(details?.diff))"></div>
      </div>

      <div v-if="details?.comments &amp;&amp; tabState?.active ==&#x27;comments&#x27;">
        <ul class="pr-comments">
          <li class="pr-comment" v-for="(comment, index) in details?.comments">
            <div class="pr-comment-head">
              <span class="pr-comment-author" v-if="comment?.author">
                <i class="far fa-user"></i> @<span v-text="comment?.author"></span>
              </span>
              <span class="pr-comment-date" v-if="comment?.updatedDate" v-text="fmt?.date(comment?.updatedDate)"></span>
            </div>
            <div class="pr-comment-body" v-if="comment?.body">
              <markdown :content="comment?.body"></markdown>
            </div>
          </li>
          <li class="paper-table-empty" v-if="!details?.comments?.length">
            <i class="far fa-comment-dots"></i>
            <span>No comments on this pull request.</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
