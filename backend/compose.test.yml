# Isolated infrastructure for backend integration tests; never uses production volumes.
services:
  mongo:
    image: mongo:7
    ports: ["127.0.0.1::27017"]
    tmpfs: ["/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1::6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
