# Add after compose.shadow.yml and compose.shadow-beta.yml for beta App testing.
services:
  app:
    environment:
      GITHUB_PERMISSION_CACHE_SECONDS: "3600"
      GITHUB_APP_ENABLED: "true"
      GITHUB_APP_NEW_CONNECTIONS: "true"
      GITHUB_APP_ID: ${SHADOW_GITHUB_APP_ID:?Set beta App ID}
      GITHUB_APP_CLIENT_ID: ${SHADOW_GITHUB_APP_CLIENT_ID:?Set beta App client ID}
      GITHUB_APP_CLIENT_SECRET: ${SHADOW_GITHUB_APP_CLIENT_SECRET:?Set beta App client secret}
      GITHUB_APP_SLUG: ${SHADOW_GITHUB_APP_SLUG:?Set beta App slug}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-beta.pem
      GITHUB_APP_CALLBACK: https://beta.durieux.me/github/app/callback
      GITHUB_APP_WEBHOOK_SECRET: ${SHADOW_GITHUB_APP_WEBHOOK_SECRET:?Set beta webhook secret}
    volumes:
      - type: bind
        source: ../secrets/github-app-beta.pem
        target: /run/secrets/github-app-beta.pem
        read_only: true
        bind:
          create_host_path: false
